# SPDX-License-Identifier: AGPL-3.0-or-later
name: Profile online validation

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-online-validation
  cancel-in-progress: true

jobs:
  validate-online:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate public providers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/validate_profile_online.py
