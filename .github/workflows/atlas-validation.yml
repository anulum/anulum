# ANULUM — Native atlas validation and source-bound browser coverage

name: Atlas validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atlas-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ATLAS_BASE_URL: http://127.0.0.1:34080/atlas/
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the supported Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.10.0
      - name: Install the integrity-locked development toolchain
        run: npm ci --ignore-scripts --no-fund
      - name: Verify the full dependency graph and registry provenance
        run: |
          npm ls --all
          npm audit --audit-level=low
          npm audit signatures
      - name: Check every source and asset licence
        run: >-
          docker run --rm --network none --volume "$GITHUB_WORKSPACE:/data:ro" --workdir /data
          fsfe/reuse:6.2.0@sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e lint
      - name: Check complete source and data types
        run: node_modules/.bin/tsc -p jsconfig.json
      - name: Lint and document every maintained module and test
        env:
          NODE_V8_COVERAGE: coverage/node
        run: node_modules/.bin/eslint docs/atlas/*.js tests/*.mjs tools/render_atlas.mjs eslint.config.mjs
      - name: Check whole maintained source and HTML formatting
        run: >-
          node_modules/.bin/prettier --check
          'docs/atlas/*.js' 'docs/atlas/*.html' docs/atlas/README.md 'tests/*.mjs' 'tests/*.ts' 'types/*.d.ts'
          tools/render_atlas.mjs eslint.config.mjs package.json package-lock.json jsconfig.json
      - name: Verify generated entries and the complete asset manifest
        run: node tools/render_atlas.mjs --check
      - name: Install the matching browser and system libraries
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise real public routes, source faults, downloads and generator inputs
        id: runtime-tests
        env:
          NODE_V8_COVERAGE: coverage/node
        run: |
          python3 -m http.server 34080 --bind 127.0.0.1 --directory docs > coverage-server.log 2>&1 &
          atlas_server_pid=$!
          trap 'kill "$atlas_server_pid"' EXIT
          for attempt in $(seq 1 30); do
            echo "Waiting for atlas server: $attempt/30"
            if curl --fail --silent "$ATLAS_BASE_URL" --output /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$ATLAS_BASE_URL" --output /dev/null
          node --test --test-concurrency=1 tests/test_resource_inventory.mjs tests/test_render_atlas.mjs tests/*.test.mjs
      # Functions stay reported at a zero threshold; statements, branches and lines are enforced.
      - name: Enforce complete per-file statement and branch coverage
        if: always() && steps.runtime-tests.outcome != 'skipped'
        run: |
          atlas_thresholds=(--check-coverage --statements 100 --branches 100 --lines 100 --functions 0 --per-file)
          mkdir -p coverage/unexecuted coverage/gate-negative
          if node_modules/.bin/c8 report --temp-directory coverage/unexecuted --reports-dir coverage/gate-negative \
            --all --include 'docs/atlas/reader-core.js' --exclude 'node_modules/**' \
            --reporter json-summary "${atlas_thresholds[@]}" > coverage/gate-negative/check.log 2>&1; then
            echo 'Coverage gate accepted an actual unexecuted production file'
            exit 1
          fi
          for metric in statements branches lines; do
            grep -F "ERROR: Coverage for $metric (0%) does not meet threshold (100%) for docs/atlas/reader-core.js" coverage/gate-negative/check.log
          done
          cp coverage/browser/*.json coverage/node/
          node_modules/.bin/c8 report --temp-directory coverage/node --reports-dir coverage/report \
            --all --include 'docs/atlas/*.js' --include 'tests/*.mjs' \
            --include tools/render_atlas.mjs --include eslint.config.mjs \
            --exclude 'node_modules/**' --reporter text --reporter json-summary --reporter json --reporter html \
            "${atlas_thresholds[@]}"
      - name: Retain the exact candidate's coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-coverage-${{ github.sha }}
          path: |
            coverage/report/
            coverage/readback/
            coverage/accessibility/
            coverage/gate-negative/
          if-no-files-found: warn
          retention-days: 14
