<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Anulum portfolio ecosystem</title>
  <desc id="description">Five independent repository portfolios connected by integration, evidence, and audit relationships.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111f"/>
      <stop offset="0.55" stop-color="#111d32"/>
      <stop offset="1" stop-color="#071821"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#f1d28a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#279d98"/>
      <stop offset="1" stop-color="#4dd6c8"/>
    </linearGradient>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d9a441"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4dd6c8"/>
    </marker>
  </defs>

  <rect width="1200" height="700" rx="28" fill="url(#background)"/>
  <g fill="none" stroke="#62748f" stroke-opacity="0.14" stroke-width="1">
    <path d="M0 88H1200M0 294H1200M0 486H1200M0 650H1200"/>
    <path d="M200 0V700M400 0V700M600 0V700M800 0V700M1000 0V700"/>
  </g>

  <text x="60" y="52" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="650" letter-spacing="3">PORTFOLIO ECOSYSTEM</text>
  <text x="1140" y="50" text-anchor="end" fill="#8da0ba" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" letter-spacing="1.4">39 REPOSITORIES · 5 INDEPENDENT GROUPS</text>

  <g fill="none" stroke-linecap="round" stroke-width="2.5">
    <path d="M230 254 C250 300 360 316 440 350" stroke="#d9a441" marker-end="url(#arrowGold)"/>
    <path d="M600 254 L600 330" stroke="#d9a441" marker-end="url(#arrowGold)"/>
    <path d="M970 254 C950 300 840 316 760 350" stroke="#d9a441" marker-end="url(#arrowGold)"/>
    <path d="M600 446 L600 514" stroke="#4dd6c8" marker-end="url(#arrowTeal)"/>
    <path d="M190 254 C150 430 270 555 360 580" stroke="#4dd6c8" stroke-dasharray="7 9" marker-end="url(#arrowTeal)"/>
    <path d="M1010 254 C1050 430 930 555 840 580" stroke="#4dd6c8" stroke-dasharray="7 9" marker-end="url(#arrowTeal)"/>
  </g>

