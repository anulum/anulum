      <rect x="430" y="105" width="8" height="150" rx="4" fill="#7992b5"/>
      <text x="462" y="148" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650">SC NEUROMORPHIC SYSTEMS</text>
      <text x="462" y="184" fill="#b8c5d8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">1</text>
      <text x="492" y="183" fill="#9fb0c7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">public repository</text>
      <text x="462" y="222" fill="#7f92ad" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">stochastic · spiking · HDC · RTL</text>
    </g>

    <g>
      <rect x="800" y="105" width="340" height="150" rx="18" fill="#111f34" stroke="#7992b5" stroke-width="2"/>
      <rect x="800" y="105" width="8" height="150" rx="4" fill="#7992b5"/>
      <text x="832" y="148" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650">SCPN QUANTUM SYSTEMS</text>
      <text x="832" y="184" fill="#b8c5d8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">1</text>
      <text x="862" y="183" fill="#9fb0c7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">public repository</text>
      <text x="832" y="222" fill="#7f92ad" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">simulation · hardware · evidence</text>
    </g>

    <g>
      <rect x="315" y="330" width="570" height="116" rx="18" fill="#102735" stroke="#d9a441" stroke-width="2"/>
      <rect x="315" y="330" width="8" height="116" rx="4" fill="url(#gold)"/>
      <text x="350" y="374" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="650">SCPN SYSTEMS INTEGRATION &amp; CONTROL</text>
      <text x="350" y="414" fill="#f1d28a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">4 repositories · semantics · control · studio · evidence</text>
    </g>

    <g>
      <rect x="240" y="514" width="720" height="120" rx="18" fill="#0d2930" stroke="#4dd6c8" stroke-width="2"/>
      <rect x="240" y="514" width="8" height="120" rx="4" fill="url(#teal)"/>
      <text x="278" y="558" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="650">AGENTIC COORDINATION, ASSURANCE &amp; CONTINUITY</text>
      <text x="278" y="600" fill="#70e0d5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">8 repositories · coordination · audit · memory · action governance</text>
    </g>
  </g>

  <text x="600" y="675" text-anchor="middle" fill="#7f92ad" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="1.5">CONTRACT FLOW · EVIDENCE FLOW · INDEPENDENT OWNERSHIP</text>
</svg>
