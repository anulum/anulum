      <rect x="60" y="105" width="8" height="150" rx="4" fill="url(#gold)"/>
      <text x="92" y="148" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="650">SCPN REACTOR SYSTEMS</text>
      <text x="92" y="184" fill="#f1d28a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">25</text>
      <text x="145" y="183" fill="#9fb0c7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">public repositories</text>
      <text x="92" y="222" fill="#7f92ad" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">physics · devices · kernels · geometry</text>
