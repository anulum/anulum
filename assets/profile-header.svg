  <rect x="72" y="66" width="84" height="4" rx="2" fill="url(#signal)"/>
  <text x="72" y="139" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="650" letter-spacing="2">MIROSLAV ŠOTEK</text>
  <text x="75" y="189" fill="#b8c5d8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="450" letter-spacing="5">EVIDENCE · COMPUTATION · CONTROL</text>
  <text x="75" y="236" fill="#7f92ad" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" letter-spacing="1.2">Independent research and systems engineering</text>
