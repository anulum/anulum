<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Miroslav Šotek</title>
  <desc id="description">Evidence, computation, and control</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111f"/>
      <stop offset="0.52" stop-color="#111d32"/>
      <stop offset="1" stop-color="#071821"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a441"/>
      <stop offset="0.48" stop-color="#f1d28a"/>
      <stop offset="1" stop-color="#4dd6c8"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#4dd6c8" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#4dd6c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <circle cx="1040" cy="150" r="230" fill="url(#halo)"/>

  <g fill="none" stroke="#62748f" stroke-opacity="0.24" stroke-width="1">
    <path d="M0 72H1200M0 160H1200M0 248H1200"/>
    <path d="M120 0V320M360 0V320M600 0V320M840 0V320M1080 0V320"/>
  </g>

  <g transform="translate(920 55)" fill="none" stroke-linecap="round">
    <circle cx="120" cy="105" r="82" stroke="#4dd6c8" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="120" cy="105" r="51" stroke="#d9a441" stroke-opacity="0.36" stroke-width="1.5"/>
    <path d="M38 105H202M120 23V187M62 47L178 163M178 47L62 163" stroke="#8da0ba" stroke-opacity="0.27"/>
    <path d="M64 139C86 72 129 57 181 85C148 95 130 127 119 164C101 143 83 135 64 139Z" stroke="url(#signal)" stroke-width="3"/>
    <g fill="#0d1727" stroke-width="3" filter="url(#softGlow)">
      <circle cx="64" cy="139" r="7" stroke="#d9a441"/>
      <circle cx="181" cy="85" r="7" stroke="#4dd6c8"/>
      <circle cx="119" cy="164" r="7" stroke="#f1d28a"/>
      <circle cx="120" cy="56" r="5" stroke="#8da0ba"/>
