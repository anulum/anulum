<!-- QPU-RESULT-PACK — Source-defined result-provenance design -->
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 1800 1420" role="img" aria-labelledby="title desc">
<title id="title">QPU-RESULT-PACK: source-defined result-provenance design</title>
<desc id="desc">A design illustration of original observations and separate custody, derivation identities, shared runtime and pack-owned comparison, separate immutable verification report and inspection without execution. Failure diagnostics and trust/history boundaries stay distinct. These are required semantics, not accepted whole-workflow or measured quantum results.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173b30}.eyebrow{font-size:18px;font-weight:700;letter-spacing:1px}.title{font-size:39px;font-weight:700}.subtitle{font-size:23px}.heading{font-size:26px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.note{font-size:17px}.box{fill:#fff;stroke:#8ea796;stroke-width:2}.side{fill:#ece8f0;stroke:#8e719f;stroke-width:2}.flow{fill:none;stroke:#587d67;stroke-width:3;marker-end:url(#arrow)}.branch{fill:none;stroke:#8e719f;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#sidearrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#587d67"/></marker><marker id="sidearrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8e719f"/></marker></defs>
<rect width="1800" height="1420" fill="#f8f8f2"/>
<text x="60" y="55" class="eyebrow">ANULUM / QPU-RESULT-PACK</text>
<text x="60" y="108" class="title">From an original observation to an inspectable result</text>
<text x="60" y="151" class="subtitle">Result-provenance design · source snapshot 13 October 2026 · content-review draft</text>
<rect x="60" y="179" width="1680" height="47" rx="7" fill="#e8efe3"/>
<text x="78" y="210" class="body">Required source semantics. Standalone domain integration and whole-workflow acceptance remain open.</text>

<rect x="60" y="260" width="1060" height="148" rx="12" class="box"/>
<text x="85" y="300" class="heading">1 · Preserve the completed-job original</text>
<text x="85" y="339" class="body">Original observations + separate custody facts</text>
<text x="85" y="375" class="body">Keep foreign bytes, original representations and each field's origin.</text>
<rect x="1150" y="260" width="590" height="218" rx="12" class="side"/>
<text x="1175" y="300" class="heading">Claims keep their own meanings</text>
<text x="1175" y="339" class="body">Count total ≠ requested resource.</text>
<text x="1175" y="375" class="body">Calibration label ≠ observed timestamp.</text>
<text x="1175" y="420" class="small">Unsigned and protected trust contexts differ.</text>
<text x="1175" y="451" class="small">Selected source versions and installed types agree.</text>
<path d="M590 408V453" class="flow"/>

<rect x="60" y="460" width="1060" height="224" rx="12" class="box"/>
<text x="85" y="502" class="heading">2 · Bind the actual derivation</text>
<text x="85" y="544" class="body">Installed programme</text><text x="550" y="544" class="body">Environment lock + ordered inputs</text>
<text x="85" y="580" class="body">Output schema + scalar inventory</text><text x="550" y="580" class="body">Precision + units + comparison</text>
<text x="85" y="616" class="body">Optional seed</text><text x="550" y="616" class="body">Validate earlier raw output</text>
<text x="85" y="658" class="small">No numerical/device/precision/tolerance profile is selected by this design.</text>
<rect x="1150" y="510" width="590" height="174" rx="12" class="side"/>
<text x="1175" y="552" class="heading">Failure stays visible</text>
<text x="1175" y="591" class="body">Failed, cancelled or resource-refused execution</text>
<text x="1175" y="627" class="body">retains actual diagnostics.</text>
<text x="1175" y="661" class="small">It does not produce a successful output.</text>
<path d="M1120 575H1143" class="branch"/>
<path d="M590 684V731" class="flow"/>

<rect x="60" y="738" width="1680" height="226" rx="12" fill="#edf2e9" stroke="#8ea796" stroke-width="2"/>
<text x="85" y="780" class="heading">3 · Keep shared evaluation and domain policy distinct</text>
<rect x="85" y="803" width="770" height="135" rx="8" class="box"/>
<text x="106" y="838" class="heading">Shared runtime owns</text>
<text x="106" y="878" class="body">Content addressing · canonicalisation · signing</text>
<text x="106" y="912" class="body">Common evaluation</text>
<text x="878" y="880" class="heading">+</text>
<rect x="930" y="803" width="785" height="135" rx="8" class="box"/>
<text x="953" y="838" class="heading">The pack owns</text>
<text x="953" y="878" class="body">Domain comparison + policy conjunction</text>
<text x="953" y="912" class="small">Common success alone does not certify measurement or eligibility.</text>
<path d="M465 964V1004" class="flow"/>

<rect x="60" y="1011" width="810" height="137" rx="12" class="box"/>
<text x="85" y="1052" class="heading">4 · Create a separate immutable report</text>
<text x="85" y="1092" class="body">Verification binds an explicit policy and time.</text>
<text x="85" y="1128" class="small">A report remains separate from the original observation and derivation.</text>
<path d="M870 1080H922" class="flow"/>
<rect x="930" y="1011" width="810" height="137" rx="12" class="box"/>
<text x="955" y="1052" class="heading">5 · Inspect and render with full scope</text>
<text x="955" y="1092" class="body">Claims · reasons · quantities · references · unavailable states</text>
<text x="955" y="1128" class="small">Escape foreign text; inspection does not execute or grant eligibility.</text>

<rect x="60" y="1190" width="1680" height="148" rx="10" fill="#ece8f0"/>
<text x="85" y="1227" class="heading">This design does not establish</text>
<text x="85" y="1265" class="body">Measured quantum results, scientific/statistical qualification, installed whole-operation acceptance or domain adoption.</text>
<text x="85" y="1301" class="small">Historical intervals need genuine event sources; an operational evaluation witness does not replace them.</text>
<text x="60" y="1370" class="note">Source: docs/ARCHITECTURE.md · SHA-256 8de9cca705f1dd0ef0fae29ac7100c3887f79be5721a08930968d580b3a010e9</text>
<text x="60" y="1399" class="note">© Miroslav Šotek · AGPL-3.0-or-later · commercial licence available · exact current validation snapshot in accompanying scope</text>
</svg>
