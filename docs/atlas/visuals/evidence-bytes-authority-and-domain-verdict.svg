<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1600" role="img" aria-labelledby="title description">
<title id="title">Evidence toolkit: bytes, authority and domain judgement</title>
<desc id="description">Original bytes and canonical identity feed passive inspection or caller-selected construction and verification. Static schemas, finite references, policy, trust, qualified signer and qualified clock have separate responsibilities. The complete report keeps Common, domain and current outcomes distinct. Scientific judgement belongs to a separate domain consumer. In development; no runtime or authority qualification performed.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,6 L8,3 Z" fill="#477655"/></marker></defs>
<rect width="1440" height="1600" fill="#fafbf8"/><g font-family="DejaVu Sans,sans-serif">
<text x="54" y="44" font-size="17" fill="#506958" font-weight="600">ANULUM / EVIDENCE MANIFEST TOOLKIT</text>
<text x="54" y="96" font-size="34" fill="#19392d" font-weight="600">Evidence toolkit: bytes, authority and verdicts</text>
<text x="54" y="134" font-size="19" fill="#506958" font-weight="400">In progress · source reading 2026-10-18 · qualified inventories remain empty</text>
<text x="54" y="187" font-size="19" fill="#19392d" font-weight="600">1 / KEEP REPRESENTATION AND IDENTITY EXPLICIT</text>
<g data-card="true"><rect x="54" y="211" width="400" height="200" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="75" y="248" font-size="23" fill="#19392d" font-weight="600">Original input bytes</text>
<text x="75" y="288" font-size="19" fill="#506958" font-weight="400">Full JSON / blob, explicit limits</text>
<text x="75" y="317" font-size="19" fill="#506958" font-weight="400">Source bytes are not a verdict</text>
<text x="75" y="346" font-size="19" fill="#506958" font-weight="400">No received executable selection</text>
</g>
<g data-card="true"><rect x="520" y="211" width="400" height="200" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="541" y="248" font-size="23" fill="#19392d" font-weight="600">Choose the identity basis</text>
<text x="541" y="288" font-size="19" fill="#506958" font-weight="400">raw_bytes or canonical JCS content</text>
<text x="541" y="317" font-size="19" fill="#506958" font-weight="400">Digest + length + media / schema</text>
<text x="541" y="346" font-size="19" fill="#506958" font-weight="400">Metadata alone does not read bytes</text>
</g>
<g data-card="true"><rect x="986" y="211" width="400" height="200" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="1007" y="248" font-size="23" fill="#19392d" font-weight="600">Inspect or compare</text>
<text x="1007" y="288" font-size="19" fill="#506958" font-weight="400">Declarations / diagnostics / pointers</text>
<text x="1007" y="317" font-size="19" fill="#506958" font-weight="400">Ordered receipt identities retained</text>
<text x="1007" y="346" font-size="19" fill="#506958" font-weight="400">Acceptance remains not evaluated</text>
</g>
<path d="M454 311 H516" fill="none" stroke="#477655" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M920 311 H982" fill="none" stroke="#477655" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="54" y="464" font-size="19" fill="#19392d" font-weight="600">2 / CONSTRUCTION AND VERIFICATION USE CALLER-SELECTED CONTEXT</text>
<g data-card="true"><rect x="54" y="488" width="400" height="222" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="75" y="525" font-size="23" fill="#19392d" font-weight="600">Schemas and references</text>
<text x="75" y="565" font-size="19" fill="#506958" font-weight="400">Complete static schema catalogue</text>
<text x="75" y="594" font-size="19" fill="#506958" font-weight="400">Actual bounded offline resolver</text>
<text x="75" y="623" font-size="19" fill="#506958" font-weight="400">Shared finite acquisition budget</text>
<text x="75" y="652" font-size="19" fill="#506958" font-weight="400">Required closure and native checks</text>
</g>
<g data-card="true"><rect x="520" y="488" width="400" height="222" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="541" y="525" font-size="23" fill="#19392d" font-weight="600">Policy, authority and time</text>
<text x="541" y="565" font-size="19" fill="#506958" font-weight="400">Exact claims / purposes / mode</text>
<text x="541" y="594" font-size="19" fill="#506958" font-weight="400">Accepted current / floor / archive</text>
<text x="541" y="623" font-size="19" fill="#506958" font-weight="400">Clock qualification stays separate</text>
<text x="541" y="652" font-size="19" fill="#506958" font-weight="400">No snapshot install or floor change</text>
</g>
<g data-card="true"><rect x="986" y="488" width="400" height="222" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="1007" y="525" font-size="23" fill="#19392d" font-weight="600">Verify the whole selection</text>
<text x="1007" y="565" font-size="19" fill="#506958" font-weight="400">Acquire complete content / receipts</text>
<text x="1007" y="594" font-size="19" fill="#506958" font-weight="400">Select independently trusted state</text>
<text x="1007" y="623" font-size="19" fill="#506958" font-weight="400">Check supplied receipt authority</text>
<text x="1007" y="652" font-size="19" fill="#506958" font-weight="400">Compose all fifteen report fields</text>
</g>
<path d="M454 599 H516" fill="none" stroke="#477655" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M920 599 H982" fill="none" stroke="#477655" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="true"><rect x="54" y="750" width="1332" height="166" rx="16" fill="#eeeaf4" stroke="#b7cbbb" stroke-width="2"/>
<text x="75" y="787" font-size="23" fill="#19392d" font-weight="600">Sealing: unsigned construction or a separately admitted signer</text>
<text x="75" y="827" font-size="19" fill="#506958" font-weight="400">The unsigned selection returns canonical content and its reference without a detached envelope.</text>
<text x="75" y="856" font-size="19" fill="#506958" font-weight="400">Signed construction checks current authority, invokes the selected signer and verifies the complete-message signature.</text>
<text x="75" y="885" font-size="19" fill="#506958" font-weight="400">A failed signer does not fall back to unsigned. The checkout supplies no qualified CLI signing adapter.</text>
</g>
<text x="54" y="970" font-size="19" fill="#19392d" font-weight="600">3 / RETAIN THE OUTCOME AXES AND THEIR OWNERS</text>
<g data-card="true"><rect x="54" y="994" width="640" height="222" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="75" y="1031" font-size="23" fill="#19392d" font-weight="600">Common verification report</text>
<text x="75" y="1071" font-size="19" fill="#506958" font-weight="400">Structure / integrity / authenticity / availability</text>
<text x="75" y="1100" font-size="19" fill="#506958" font-weight="400">Common eligibility and current eligibility</text>
<text x="75" y="1129" font-size="19" fill="#506958" font-weight="400">Complete references, observations and reasons</text>
<text x="75" y="1158" font-size="19" fill="#506958" font-weight="400">Historical eligibility does not imply current</text>
</g>
<g data-card="true"><rect x="746" y="994" width="640" height="222" rx="16" fill="#e8f0f7" stroke="#b7cbbb" stroke-width="2"/>
<text x="767" y="1031" font-size="23" fill="#19392d" font-weight="600">Domain judgement stays separate</text>
<text x="767" y="1071" font-size="19" fill="#506958" font-weight="400">domain_verdict = not_evaluated</text>
<text x="767" y="1100" font-size="19" fill="#506958" font-weight="400">Scientific / engineering consumer owns its verdict</text>
<text x="767" y="1129" font-size="19" fill="#506958" font-weight="400">A published report or exit zero is not that verdict</text>
<text x="767" y="1158" font-size="19" fill="#506958" font-weight="400">Source inspection is not an accepted deployment</text>
</g>
<g data-card="true"><rect x="54" y="1256" width="1332" height="166" rx="16" fill="#e8f0f7" stroke="#b7cbbb" stroke-width="2"/>
<text x="75" y="1293" font-size="23" fill="#19392d" font-weight="600">Concrete integration and partner roles</text>
<text x="75" y="1333" font-size="19" fill="#506958" font-weight="400">Domain validation; complete schema / policy / reference custody; independently accepted authority and qualified time.</text>
<text x="75" y="1362" font-size="19" fill="#506958" font-weight="400">Locally enrolled signing, matching installed packaging and source-bound consumer / storage-platform qualification.</text>
<text x="75" y="1391" font-size="19" fill="#506958" font-weight="400">These are required responsibilities, not agreed partners, provisioned services or a new scientific acceptance.</text>
</g>
<text x="54" y="1474" font-size="19" fill="#506958" font-weight="400">Four offline command grammars: seal / verify / inspect / diff. Canonicalisation and byte references are Python functions.</text>
<text x="54" y="1510" font-size="19" fill="#506958" font-weight="400">Earlier unchanged documentation retains its own date; current code readings are uncommitted source observations.</text>
<text x="54" y="1563" font-size="18" fill="#506958" font-weight="400">No runtime execution · source-owner content, scientific, consumer and publication review pending</text>
</g></svg>
