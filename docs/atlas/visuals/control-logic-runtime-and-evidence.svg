<text x="54" y="436" font-size="19" font-weight="600" fill="#19392d">2 / EXECUTE ONE DECLARED CONTROL TICK</text>
<rect x="54" y="459" width="400" height="172" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="74" y="495" font-size="23" font-weight="600" fill="#19392d">Observations and targets</text>
<text x="74" y="534" font-size="19" font-weight="400" fill="#506958">Named or fixed-order observations</text>
<text x="74" y="562" font-size="19" font-weight="400" fill="#506958">Declared targets and scales</text>
<text x="74" y="590" font-size="19" font-weight="400" fill="#506958">Signed error → positive / negative</text>
<rect x="520" y="459" width="400" height="172" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="540" y="495" font-size="23" font-weight="600" fill="#19392d">NeuroSymbolicController</text>
<text x="540" y="534" font-size="19" font-weight="400" fill="#506958">Inject features into place markings</text>
<text x="540" y="562" font-size="19" font-weight="400" fill="#506958">Selected stochastic execution</text>
<text x="540" y="590" font-size="19" font-weight="400" fill="#506958">Optional float-oracle diagnostics</text>
<rect x="986" y="459" width="400" height="172" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="1006" y="495" font-size="23" font-weight="600" fill="#19392d">Return bounded commands</text>
<text x="1006" y="534" font-size="19" font-weight="400" fill="#506958">Decode configured action channels</text>
<text x="1006" y="562" font-size="19" font-weight="400" fill="#506958">Gain, slew and absolute limits</text>
<text x="1006" y="590" font-size="19" font-weight="400" fill="#506958">Caller owns downstream integration</text>
<path d="M454 545 H516" fill="none" stroke="#477655" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M920 545 H982" fill="none" stroke="#477655" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="54" y="658" width="1332" height="120" rx="16" fill="#f3f1e9" stroke="#d6c9a8" stroke-width="2"/>
<text x="75" y="693" font-size="21" font-weight="600" fill="#19392d">Trace records and deadlines depend on the selected execution mode.</text>
<text x="75" y="728" font-size="18" font-weight="400" fill="#506958">Optional JSONL retains observations, features, firings, marking, actions and timing. Strict deadline mode refuses synchronous logs.</text>
<text x="75" y="757" font-size="18" font-weight="400" fill="#506958">With an admitted deadline monitor, a strict overrun restores control-relevant state before the error propagates.</text>
<text x="54" y="829" font-size="19" font-weight="600" fill="#19392d">3 / OPTIONAL STATEFUL NEURON EXECUTION — A SEPARATE CONTRACT</text>
<rect x="54" y="853" width="400" height="172" rx="16" fill="#e8f0f7" stroke="#b7cbbb" stroke-width="2"/>
<text x="74" y="889" font-size="23" font-weight="600" fill="#19392d">Exact profile binding</text>
<text x="74" y="928" font-size="19" font-weight="400" fill="#506958">Explicit compiler option</text>
<text x="74" y="956" font-size="19" font-weight="400" fill="#506958">SC-NeuroCore version / units / SHA</text>
<text x="74" y="984" font-size="19" font-weight="400" fill="#506958">Consumer pin, not a latest claim</text>
<rect x="520" y="853" width="400" height="172" rx="16" fill="#e8f0f7" stroke="#b7cbbb" stroke-width="2"/>
<text x="540" y="889" font-size="23" font-weight="600" fill="#19392d">Persistent exact-current LIF</text>
<text x="540" y="928" font-size="19" font-weight="400" fill="#506958">Membrane state and shot time</text>
<text x="540" y="956" font-size="19" font-weight="400" fill="#506958">Complete ordered SC packets</text>
<text x="540" y="984" font-size="19" font-weight="400" fill="#506958">Checkpoint / restore / explicit reset</text>
<rect x="986" y="853" width="400" height="172" rx="16" fill="#e8f0f7" stroke="#b7cbbb" stroke-width="2"/>
<text x="1006" y="889" font-size="23" font-weight="600" fill="#19392d">Keep modes distinct</text>
<text x="1006" y="928" font-size="19" font-weight="400" fill="#506958">Stateless lif_fire gate unchanged</text>
<text x="1006" y="956" font-size="19" font-weight="400" fill="#506958">No stochastic / adaptive substitution</text>
<text x="1006" y="984" font-size="19" font-weight="400" fill="#506958">No RTL or HIL inference</text>
<path d="M454 939 H516" fill="none" stroke="#477655" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="54" y="1076" font-size="19" font-weight="600" fill="#19392d">4 / DISTINCT EVIDENCE AND ACCEPTANCE CONTRACTS</text>
<rect x="54" y="1100" width="400" height="182" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="74" y="1136" font-size="23" font-weight="600" fill="#19392d">Runtime-bound proof</text>
<text x="74" y="1175" font-size="19" font-weight="400" fill="#506958">Bounded formal certificate</text>
<text x="74" y="1203" font-size="19" font-weight="400" fill="#506958">Topology / config / target / timing</text>
<text x="74" y="1231" font-size="19" font-weight="400" fill="#506958">Matching live identity and replay</text>
<rect x="520" y="1100" width="400" height="182" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="540" y="1136" font-size="23" font-weight="600" fill="#19392d">Live host admission</text>
<text x="540" y="1175" font-size="19" font-weight="400" fill="#506958">off / warn / require policies</text>
<text x="540" y="1203" font-size="19" font-weight="400" fill="#506958">RT kernel, affinity, scheduler, locks</text>
<text x="540" y="1231" font-size="19" font-weight="400" fill="#506958">Historical reader ≠ live host proof</text>
<rect x="986" y="1100" width="400" height="182" rx="16" fill="#f3f1e9" stroke="#b7cbbb" stroke-width="2"/>
<text x="1006" y="1136" font-size="23" font-weight="600" fill="#19392d">Semantic review only</text>
<text x="1006" y="1175" font-size="19" font-weight="400" fill="#506958">Fusion → SPO → CONTROL bytes</text>
<text x="1006" y="1203" font-size="19" font-weight="400" fill="#506958">Review-only; non-actionable</text>
<text x="1006" y="1231" font-size="19" font-weight="400" fill="#506958">Creates no ControlAction</text>
<rect x="54" y="1318" width="1332" height="180" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="75" y="1356" font-size="23" font-weight="600" fill="#19392d">Plant models, controller commands and facility acceptance remain separately evidenced.</text>
<text x="75" y="1395" font-size="19" font-weight="400" fill="#506958">Fusion owns broad physics development; CONTROL ports or wraps selected control-facing surfaces.</text>
<text x="75" y="1425" font-size="19" font-weight="400" fill="#506958">The documented integrated-scenario heating demo is a separate bounded simulation route, not every controller wired together.</text>
<text x="75" y="1455" font-size="19" font-weight="400" fill="#506958">Software commands, replay packets, formal proofs and local timing do not establish physical actuation or facility safety approval.</text>
<text x="54" y="1580" font-size="19" font-weight="400" fill="#506958">Source inspection only · no compiler / controller / proof / neuron / host / plant run</text>
<text x="54" y="1614" font-size="19" font-weight="400" fill="#506958">Source-owner content, installed-profile adoption and publication review pending</text>
