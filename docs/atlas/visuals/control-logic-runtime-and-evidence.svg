<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1660" role="img" aria-labelledby="title description">
<title id="title">SCPN Control: controller logic, execution and evidence</title>
<desc id="description">Petri-net structure compiles to a configured controller artefact. A control tick maps declared observations and targets to features, marking updates and bounded returned commands. A separately bound persistent exact-current SC-NeuroCore mode has its own state and packets. Formal runtime identity, host timing and review-only semantics retain separate contracts. Source inspection only; no compiler, controller, neuron or physical loop executed.</desc>
