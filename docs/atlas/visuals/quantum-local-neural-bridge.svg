<text x="54" y="132" font-size="19" font-weight="400" fill="#506958">In progress · inspected source 2026-10-15 · workflows and evidence retain their own scope</text>
<text x="54" y="190" font-size="19" font-weight="600" fill="#19392d">LOCAL SNNQuantumBridge PATH</text>
