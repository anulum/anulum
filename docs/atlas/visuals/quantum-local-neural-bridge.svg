<text x="75" y="727" font-size="21" font-weight="600" fill="#19392d">This captured bridge executes local statevector software.</text>
<text x="75" y="760" font-size="19" font-weight="400" fill="#506958">Its output is scaled binary spikes. It does not submit a QPU job or establish neural / quantum equivalence.</text>
<text x="54" y="841" font-size="19" font-weight="600" fill="#19392d">SEPARATE WORKBENCH ROUTES</text>
