<path d="M920 953 H982" fill="none" stroke="#477655" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="75" y="1080" font-size="20" font-weight="400" fill="#506958">Contracts describe the request; execution is a separate action. Hardware needs its own admission.</text>
<rect x="54" y="1119" width="1332" height="204" rx="16" fill="#f3f1e9" stroke="#d6c9a8" stroke-width="2"/>
<text x="75" y="1157" font-size="20" font-weight="600" fill="#19392d">RESOURCE AND CLAIM BOUNDARIES</text>
<text x="75" y="1196" font-size="19" font-weight="400" fill="#506958">Dense / compile budgets estimate allowed or refused work; they do not guarantee host-memory immunity.</text>
<text x="75" y="1233" font-size="19" font-weight="400" fill="#506958">The gradient guide reports bounded candidates; no differentiable route is promoted in that capture.</text>
<text x="75" y="1270" font-size="19" font-weight="400" fill="#506958">Software results, QPU measurements, scientific fidelity and a performance advantage need separate evidence.</text>
