<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1450" role="img" aria-labelledby="title description"><title id="title">Quantum Control: a concrete local neural bridge</title><desc id="description">Trailing spike histories become firing rates and rotation inputs for a local dense statevector layer. Thresholded binary spikes return as scaled currents. Stable contracts and external provider execution are separate routes.</desc>
