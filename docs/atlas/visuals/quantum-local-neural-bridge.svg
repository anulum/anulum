<text x="74" y="562" font-size="19" font-weight="400" fill="#506958">Binary spikes multiplied by scale</text>
<text x="74" y="590" font-size="19" font-weight="400" fill="#506958">Current array returned to caller</text>
<text x="74" y="618" font-size="19" font-weight="400" fill="#506958">Consumer chooses integration</text>
