<title id="title">Reactor Kernels: geometry, CAD and model ownership</title>
<desc id="description">Source-supported geometry and export routes: declared bodies become closed float64 triangle meshes and separate float32 STL or GLB files. Optional B-rep solids and native-unit STEP feed tetrahedral meshing. Device physics, material properties, source validity and consumer acceptance remain separate. No geometry or simulation was executed for this illustration.</desc>
