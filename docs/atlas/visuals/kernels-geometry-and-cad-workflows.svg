<text x="1006" y="313" font-size="19" font-weight="400" fill="#506958">Consumer owns its pin in force</text>
<text x="1006" y="341" font-size="19" font-weight="400" fill="#506958">Registration history is not that pin</text>
<text x="54" y="416" font-size="19" font-weight="600" fill="#19392d">GEOMETRY AND OPEN-FORMAT EXPORT</text>
