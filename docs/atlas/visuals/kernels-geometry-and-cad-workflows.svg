<text x="74" y="544" font-size="19" font-weight="400" fill="#506958">Spheres and rectangular prisms</text>
<text x="74" y="572" font-size="19" font-weight="400" fill="#506958">Selected placement operations</text>
<rect x="520" y="441" width="400" height="172" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="540" y="477" font-size="23" font-weight="600" fill="#19392d">Closed triangle mesh</text>
<text x="540" y="516" font-size="19" font-weight="400" fill="#506958">Closure and orientation checks</text>
<text x="540" y="544" font-size="19" font-weight="400" fill="#506958">float64 vertices / triangle indices</text>
<text x="540" y="572" font-size="19" font-weight="400" fill="#506958">Canonical geometry bytes + digest</text>
<rect x="986" y="441" width="400" height="172" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="1006" y="477" font-size="23" font-weight="600" fill="#19392d">STL and glTF / GLB</text>
<text x="1006" y="516" font-size="19" font-weight="400" fill="#506958">float32 position storage</text>
<text x="1006" y="544" font-size="19" font-weight="400" fill="#506958">STL: caller-owned coordinate rebase</text>
<text x="1006" y="572" font-size="19" font-weight="400" fill="#506958">GLB: local mesh + node transform</text>
<path d="M454 527 H516" fill="none" stroke="#477655" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M920 527 H982" fill="none" stroke="#477655" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="54" y="639" width="1332" height="119" rx="16" fill="#f3f1e9" stroke="#d6c9a8" stroke-width="2"/>
<text x="75" y="674" font-size="21" font-weight="600" fill="#19392d">The exported representation has its own precision and placement contract.</text>
<text x="75" y="709" font-size="19" font-weight="400" fill="#506958">The canonical mesh digest identifies float64 geometry, not the STL / GLB bytes or material properties.</text>
<text x="75" y="739" font-size="19" font-weight="400" fill="#506958">Storage checks refuse unsupported geometry; a visible rendered body alone is not evidence of preserved shape.</text>
<text x="54" y="811" font-size="19" font-weight="600" fill="#19392d">OPTIONAL CAD AND VOLUME MESHING</text>
<rect x="54" y="836" width="400" height="172" rx="16" fill="#e8f0f7" stroke="#b7cbbb" stroke-width="2"/>
<text x="74" y="872" font-size="23" font-weight="600" fill="#19392d">B-rep solids and assembly</text>
<text x="74" y="911" font-size="19" font-weight="400" fill="#506958">Optional third-party CAD backend</text>
<text x="74" y="939" font-size="19" font-weight="400" fill="#506958">Named bodies in a declared order</text>
<text x="74" y="967" font-size="19" font-weight="400" fill="#506958">Faceting can return TriangleMesh</text>
<rect x="520" y="836" width="400" height="172" rx="16" fill="#e8f0f7" stroke="#b7cbbb" stroke-width="2"/>
<text x="540" y="872" font-size="23" font-weight="600" fill="#19392d">Native-unit STEP</text>
<text x="540" y="911" font-size="19" font-weight="400" fill="#506958">Writer uses metre length contexts</text>
<text x="540" y="939" font-size="19" font-weight="400" fill="#506958">Provenance does not set the scale</text>
<text x="540" y="967" font-size="19" font-weight="400" fill="#506958">Deterministic within one environment</text>
<rect x="986" y="836" width="400" height="172" rx="16" fill="#e8f0f7" stroke="#b7cbbb" stroke-width="2"/>
<text x="1006" y="872" font-size="23" font-weight="600" fill="#19392d">Tetrahedral MSH 4.1</text>
<text x="1006" y="911" font-size="19" font-weight="400" fill="#506958">Metre coordinates and cell size</text>
<text x="1006" y="939" font-size="19" font-weight="400" fill="#506958">Per-entity cubic-metre volumes</text>
<text x="1006" y="967" font-size="19" font-weight="400" fill="#506958">Explicit gmsh session ownership</text>
<path d="M454 922 H516" fill="none" stroke="#477655" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M920 922 H982" fill="none" stroke="#477655" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="75" y="1044" font-size="19" font-weight="400" fill="#506958">Third-party CAD uses its own analytic/tolerance evidence; mathematical Python / Rust bit parity is a different claim.</text>
<rect x="54" y="1090" width="640" height="202" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="74" y="1126" font-size="23" font-weight="600" fill="#19392d">Device-family ownership</text>
<text x="74" y="1165" font-size="19" font-weight="400" fill="#506958">Device model and chosen geometry</text>
<text x="74" y="1193" font-size="19" font-weight="400" fill="#506958">Operating envelope, lifecycle and diagnostics</text>
<text x="74" y="1221" font-size="19" font-weight="400" fill="#506958">Source, physics and validation evidence</text>
<text x="74" y="1249" font-size="19" font-weight="400" fill="#506958">A complete reactor model needs its own evidence</text>
<rect x="746" y="1090" width="640" height="202" rx="16" fill="#f3f1e9" stroke="#b7cbbb" stroke-width="2"/>
<text x="766" y="1126" font-size="23" font-weight="600" fill="#19392d">Separate responsibilities</text>
<text x="766" y="1165" font-size="19" font-weight="400" fill="#506958">Numerical primitive ≠ reactor solver</text>
<text x="766" y="1193" font-size="19" font-weight="400" fill="#506958">Mesh / CAD file ≠ physical field result</text>
<text x="766" y="1221" font-size="19" font-weight="400" fill="#506958">Volume mesh ≠ engineering qualification</text>
<text x="766" y="1249" font-size="19" font-weight="400" fill="#506958">Consumer integration needs its own admission</text>
<text x="75" y="1340" font-size="20" font-weight="400" fill="#506958">Signal semantics, control admission, portfolio execution and final protection retain their external owners.</text>
<text x="75" y="1376" font-size="19" font-weight="400" fill="#506958">This library supplies declared-input results. It does not supply an actuator path or a qualified real-machine model.</text>
<text x="54" y="1450" font-size="18" font-weight="400" fill="#506958">Source inspection only · no kernel / CAD / simulation run · source-owner and publication review pending</text>
