<text x="75" y="346" font-size="19" fill="#506958" font-weight="400">Bank, voltage and requested pulse</text>
<text x="75" y="375" font-size="19" fill="#506958" font-weight="400">Optional prescribed expansion</text>
<rect x="520" y="211" width="400" height="222" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="541" y="248" font-size="23" fill="#19392d" font-weight="600">Compute and check</text>
<text x="541" y="288" font-size="19" fill="#506958" font-weight="400">Moving-frame phase / position trace</text>
<text x="541" y="317" font-size="19" fill="#506958" font-weight="400">Sustained phase-and-spatial lock</text>
<text x="541" y="346" font-size="19" fill="#506958" font-weight="400">Sampled envelope + bank feasibility</text>
<text x="541" y="375" font-size="19" fill="#506958" font-weight="400">Optional recovery from given fields</text>
<rect x="986" y="211" width="400" height="222" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="1007" y="248" font-size="23" fill="#19392d" font-weight="600">MIF decision report</text>
<text x="1007" y="288" font-size="19" fill="#506958" font-weight="400">Fire / hold / abort unsafe or bank</text>
<text x="1007" y="317" font-size="19" fill="#506958" font-weight="400">Trace, lock time and safety result</text>
<text x="1007" y="346" font-size="19" fill="#506958" font-weight="400">Bank energy and optional recovery</text>
<text x="1007" y="375" font-size="19" fill="#506958" font-weight="400">Safety first, then lock, then bank</text>
