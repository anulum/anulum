<text x="75" y="587" font-size="19" fill="#506958" font-weight="400">Stateless stochastic transition gate</text>
<text x="75" y="616" font-size="19" fill="#506958" font-weight="400">Rust dense + explicit-state checks</text>
<text x="75" y="645" font-size="19" fill="#506958" font-weight="400">CONTROL pulsed-shot scheduler</text>
<text x="75" y="674" font-size="19" fill="#506958" font-weight="400">No temporal state in this permit</text>
<rect x="520" y="510" width="400" height="222" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="541" y="547" font-size="23" fill="#19392d" font-weight="600">MIF RTL simulation</text>
<text x="541" y="587" font-size="19" fill="#506958" font-weight="400">Deterministic ADC-reference input</text>
<text x="541" y="616" font-size="19" fill="#506958" font-weight="400">Actual Verilator trigger fabric</text>
<text x="541" y="645" font-size="19" fill="#506958" font-weight="400">Reference agreement and veto</text>
<text x="541" y="674" font-size="19" fill="#506958" font-weight="400">Count the observed RTL pulses</text>
<rect x="986" y="510" width="400" height="222" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="1007" y="547" font-size="23" fill="#19392d" font-weight="600">FUSION model actuator</text>
<text x="1007" y="587" font-size="19" fill="#506958" font-weight="400">MIF fire + CONTROL admission</text>
<text x="1007" y="616" font-size="19" fill="#506958" font-weight="400">Require exactly one RTL trigger</text>
<text x="1007" y="645" font-size="19" fill="#506958" font-weight="400">Compression trajectory + recovery</text>
<text x="1007" y="674" font-size="19" fill="#506958" font-weight="400">Physics remains FUSION-owned</text>
<path d="M454 621 H516" fill="none" stroke="#477655" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M920 621 H982" fill="none" stroke="#477655" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="54" y="772" width="1332" height="166" rx="16" fill="#eeeaf4" stroke="#b7cbbb" stroke-width="2"/>
<text x="75" y="809" font-size="23" fill="#19392d" font-weight="600">Separate branch: stateful exact-current AER diagnostic</text>
<text x="75" y="849" font-size="19" fill="#506958" font-weight="400">ADC-reference events → integrity / address mapping → CONTROL exact-current state evolution</text>
<text x="75" y="878" font-size="19" fill="#506958" font-weight="400">Normalised simulation calibration; event, projection and execution identities stay in the case record.</text>
<text x="75" y="907" font-size="19" fill="#506958" font-weight="400">actuation_authority = false. This branch does not replace the transition permit, scheduler or independent veto.</text>
<text x="54" y="993" font-size="19" fill="#19392d" font-weight="600">3 / RETAIN THE CASE RECORD AND ITS EVIDENCE CLASS</text>
<rect x="54" y="1017" width="640" height="222" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="75" y="1054" font-size="23" fill="#19392d" font-weight="600">Replay and output custody</text>
<text x="75" y="1094" font-size="19" fill="#506958" font-weight="400">Run nominal and unsafe-veto cases, then rerun both</text>
<text x="75" y="1123" font-size="19" fill="#506958" font-weight="400">Compare canonical JSON and each trajectory channel</text>
<text x="75" y="1152" font-size="19" fill="#506958" font-weight="400">Manifest binds sources, artefacts, versions and tools</text>
<text x="75" y="1181" font-size="19" fill="#506958" font-weight="400">Payload keeps the distinct neural execution modes</text>
<rect x="746" y="1017" width="640" height="222" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="767" y="1054" font-size="23" fill="#19392d" font-weight="600">Different timing claims</text>
<text x="767" y="1094" font-size="19" fill="#506958" font-weight="400">Model traces / sampled certificate: software scope</text>
<text x="767" y="1123" font-size="19" fill="#506958" font-weight="400">Local Verilator and formal cycles: distinct evidence</text>
<text x="767" y="1152" font-size="19" fill="#506958" font-weight="400">Post-route device and end-to-end HIL: separate</text>
<text x="767" y="1181" font-size="19" fill="#506958" font-weight="400">Sub-50 ns remains a physical engineering target</text>
<rect x="54" y="1281" width="1332" height="200" rx="16" fill="#e8f0f7" stroke="#b7cbbb" stroke-width="2"/>
<text x="75" y="1318" font-size="23" fill="#19392d" font-weight="600">Before hardware or physical claims</text>
<text x="75" y="1358" font-size="19" fill="#506958" font-weight="400">Named FPGA / toolchain / constraints / PVT corner / timing-report identity</text>
<text x="75" y="1387" font-size="19" fill="#506958" font-weight="400">Calibrated ADC, sensor link, driver, measurement instrument and trace identity</text>
<text x="75" y="1416" font-size="19" fill="#506958" font-weight="400">Source-bound physical models, independent reference comparisons and actual consumer acceptance</text>
<text x="75" y="1445" font-size="19" fill="#506958" font-weight="400">An inspectable software result does not connect or qualify a physical reactor.</text>
<text x="54" y="1540" font-size="19" fill="#506958" font-weight="400">FUSION owns plasma physics; MIF kinematic evolution and prescribed recovery inputs retain their own meaning.</text>
<text x="54" y="1574" font-size="19" fill="#506958" font-weight="400">Nominal software admission calls a model actuator; unsafe-veto injection must suppress that call.</text>
<text x="54" y="1650" font-size="19" fill="#506958" font-weight="400">Source reading only · no kinematic / control / RTL / formal / FUSION / hardware execution performed</text>
<text x="54" y="1686" font-size="19" fill="#506958" font-weight="400">Source-owner content, scientific, consumer and publication review pending</text>
