<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1740" role="img" aria-labelledby="title description">
<title id="title">MIF: kinematics, trigger decisions and evidence</title>
<desc id="description">A declared kinematic scenario produces a sampled safety, lock and bank decision. The separately bound software demonstration requires CONTROL admission and an observed local Verilator pulse before calling the FUSION model. The stateful exact-current AER diagnostic is a separate non-actuating branch. Replay provenance, software cycles and physical timing evidence remain distinct. Source reading only; no model or hardware executed.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,6 L8,3 Z" fill="#477655"/></marker></defs>
<rect width="1440" height="1740" fill="#fafbf8"/><g font-family="DejaVu Sans,sans-serif">
<text x="54" y="44" font-size="17" fill="#506958" font-weight="600">ANULUM / SCPN REACTOR SYSTEMS</text>
<text x="54" y="96" font-size="34" fill="#19392d" font-weight="600">MIF: kinematics, trigger decisions and evidence</text>
<text x="54" y="134" font-size="19" fill="#506958" font-weight="400">In progress · source capture 2026-10-18 · source-described software and model responsibilities</text>
<text x="54" y="187" font-size="19" fill="#19392d" font-weight="600">1 / MIF DECISION — SAMPLE THE DECLARED MERGE SCENARIO</text>
