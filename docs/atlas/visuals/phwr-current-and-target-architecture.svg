<title id="title">PHWR: current software and the research system in progress</title>
<desc id="description">The current implementation validates repository inputs and CI results. Reactor geometry, coupled physics, fuel history, separate prediction and qualified 3D/CAD consumers are research targets. All work is in progress; this diagram gives no scientific, runtime or deployment acceptance.</desc>
