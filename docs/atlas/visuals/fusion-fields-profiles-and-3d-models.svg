<text x="540" y="313" font-size="19" font-weight="400" fill="#506958">Explicit compiled JAX option</text>
<text x="540" y="341" font-size="19" font-weight="400" fill="#506958">Convergence and reference checks</text>
<rect x="986" y="210" width="400" height="172" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
