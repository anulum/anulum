<text x="54" y="96" font-size="32" font-weight="600" fill="#19392d">Fusion Core: fields, profiles, diagnostics and 3D models</text>
<text x="54" y="132" font-size="19" font-weight="400" fill="#506958">In progress · source capture 2026-10-18 · source-described solver and representation paths</text>
<text x="54" y="187" font-size="19" font-weight="600" fill="#19392d">1 / DEFINE THE EQUILIBRIUM CASE AND SELECT ITS SOLVER</text>
