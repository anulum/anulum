<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1640" role="img" aria-labelledby="title description">
<title id="title">Fusion Core: fields, profiles, diagnostics and 3D models</title>
<desc id="description">A declared equilibrium problem produces selected flux and field outputs. Radial transport, synthetic and inverse diagnostics, toroidal surface export and reduced Fourier force-balance retain their own inputs and representations. Case-bound evidence and downstream consumer admission are separate. Source inspection only; no physics model, geometry export or hardware executed.</desc>
