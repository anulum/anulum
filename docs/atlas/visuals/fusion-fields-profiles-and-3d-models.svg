<text x="54" y="433" font-size="19" font-weight="600" fill="#19392d">2 / RELATED LANES WITH THEIR OWN INPUTS AND ASSUMPTIONS</text>
<rect x="54" y="457" width="400" height="172" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="74" y="493" font-size="23" font-weight="600" fill="#19392d">Radial transport</text>
<text x="74" y="532" font-size="19" font-weight="400" fill="#506958">Temperature / density and geometry</text>
<text x="74" y="560" font-size="19" font-weight="400" fill="#506958">Declared sources and closures</text>
<text x="74" y="588" font-size="19" font-weight="400" fill="#506958">Evolved profiles and diffusivities</text>
<rect x="520" y="457" width="400" height="172" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
