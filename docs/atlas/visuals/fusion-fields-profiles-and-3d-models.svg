<text x="540" y="532" font-size="19" font-weight="400" fill="#506958">Virtual instruments and noise</text>
<text x="540" y="560" font-size="19" font-weight="400" fill="#506958">Forward / line-integrated channels</text>
<text x="540" y="588" font-size="19" font-weight="400" fill="#506958">Reconstructed fields and metrics</text>
<rect x="986" y="457" width="400" height="172" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="1006" y="493" font-size="23" font-weight="600" fill="#19392d">Three-dimensional views</text>
<text x="1006" y="532" font-size="19" font-weight="400" fill="#506958">Traced 2D LCFS or Fourier shaping</text>
<text x="1006" y="560" font-size="19" font-weight="400" fill="#506958">Triangulated surface and OBJ</text>
<text x="1006" y="588" font-size="19" font-weight="400" fill="#506958">A representation with its own scope</text>
<rect x="54" y="655" width="1332" height="119" rx="16" fill="#f3f1e9" stroke="#d6c9a8" stroke-width="2"/>
<text x="75" y="690" font-size="21" font-weight="600" fill="#19392d">A field, a profile, a reconstructed signal and a surface describe different calculations.</text>
<text x="75" y="725" font-size="19" font-weight="400" fill="#506958">Each lane retains its selected geometry, sources, numerical resolution, backend and evidence.</text>
<text x="75" y="755" font-size="19" font-weight="400" fill="#506958">This is a map of related capabilities; it does not assert that every module runs in one automatic pipeline.</text>
<text x="54" y="825" font-size="19" font-weight="600" fill="#19392d">3 / TWO DISTINCT THREE-DIMENSIONAL OUTPUTS</text>
<rect x="54" y="849" width="640" height="202" rx="16" fill="#e8f0f7" stroke="#b7cbbb" stroke-width="2"/>
<text x="74" y="885" font-size="23" font-weight="600" fill="#19392d">Geometric surface</text>
<text x="74" y="924" font-size="19" font-weight="400" fill="#506958">Trace an approximate 2D boundary</text>
<text x="74" y="952" font-size="19" font-weight="400" fill="#506958">Or sample a reduced Fourier surface</text>
<text x="74" y="980" font-size="19" font-weight="400" fill="#506958">Return triangle vertices / faces and OBJ</text>
<text x="74" y="1008" font-size="19" font-weight="400" fill="#506958">Closest-sample / ellipse fallbacks</text>
<rect x="746" y="849" width="640" height="202" rx="16" fill="#e8f0f7" stroke="#b7cbbb" stroke-width="2"/>
<text x="766" y="885" font-size="23" font-weight="600" fill="#19392d">Reduced ForceBalance3D</text>
<text x="766" y="924" font-size="19" font-weight="400" fill="#506958">Sample a reduced MHD force residual</text>
<text x="766" y="952" font-size="19" font-weight="400" fill="#506958">Iterate Fourier mode coefficients</text>
<text x="766" y="980" font-size="19" font-weight="400" fill="#506958">Return residual history / convergence</text>
<text x="766" y="1008" font-size="19" font-weight="400" fill="#506958">Separate from a full VMEC formulation</text>
<text x="54" y="1102" font-size="19" font-weight="600" fill="#19392d">4 / INTERCHANGE, CASE EVIDENCE AND CONSUMER OWNERSHIP</text>
<rect x="54" y="1126" width="400" height="172" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="74" y="1162" font-size="23" font-weight="600" fill="#19392d">Distinct exported records</text>
<text x="74" y="1201" font-size="19" font-weight="400" fill="#506958">GEQDSK / IMAS and model data</text>
<text x="74" y="1229" font-size="19" font-weight="400" fill="#506958">Figures / meshes / controller research</text>
<text x="74" y="1257" font-size="19" font-weight="400" fill="#506958">Source-bound reports and manifests</text>
<rect x="520" y="1126" width="400" height="172" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="540" y="1162" font-size="23" font-weight="600" fill="#19392d">Case-level qualification</text>
<text x="540" y="1201" font-size="19" font-weight="400" fill="#506958">Actual inputs and convergence</text>
<text x="540" y="1229" font-size="19" font-weight="400" fill="#506958">Reference / conservation / parity</text>
<text x="540" y="1257" font-size="19" font-weight="400" fill="#506958">Synthetic or measured origin</text>
<rect x="986" y="1126" width="400" height="172" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="1006" y="1162" font-size="23" font-weight="600" fill="#19392d">Downstream consumers</text>
<text x="1006" y="1201" font-size="19" font-weight="400" fill="#506958">CONTROL: its own admission</text>
<text x="1006" y="1229" font-size="19" font-weight="400" fill="#506958">MIF / Quantum: their own workflows</text>
<text x="1006" y="1257" font-size="19" font-weight="400" fill="#506958">Studio: discovery and interface</text>
<rect x="54" y="1334" width="1332" height="136" rx="16" fill="#edf3ee" stroke="#b7cbbb" stroke-width="2"/>
<text x="75" y="1373" font-size="23" font-weight="600" fill="#19392d">A 3D view does not complete a reactor design or qualify a physical plant.</text>
<text x="75" y="1412" font-size="19" font-weight="400" fill="#506958">Engineering, material, wall, thermal and nuclear models retain their own assumptions and validation requirements.</text>
<text x="75" y="1443" font-size="19" font-weight="400" fill="#506958">Solver availability, a valid export or a narrow benchmark does not settle full-fidelity or facility acceptance.</text>
<text x="54" y="1558" font-size="19" font-weight="400" fill="#506958">Source inspection only · no equilibrium / transport / diagnostic / 3D / export / backend execution</text>
<text x="54" y="1592" font-size="19" font-weight="400" fill="#506958">Source-owner content, scientific, consumer and publication review pending</text>
