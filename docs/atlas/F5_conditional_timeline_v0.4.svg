<text x="87" y="740" font-size="18" fill="#647968" font-weight="600">TARGET 01</text>
<text x="87" y="780" font-size="21" fill="#19392d" font-weight="400">Found the proposed organisational vehicles; legal scope</text>
<text x="87" y="807" font-size="21" fill="#19392d" font-weight="400">and quotations remain to be agreed.</text>
<rect x="875" y="705" width="775" height="180" rx="12" fill="#edf3ee" stroke="#cad8cd"/>
<text x="897" y="740" font-size="18" fill="#647968" font-weight="600">TARGET 02</text>
<text x="897" y="780" font-size="21" fill="#19392d" font-weight="400">Continuous metered operation and a published cost per</text>
<text x="897" y="807" font-size="21" fill="#19392d" font-weight="400">research cycle.</text>
<rect x="1685" y="705" width="775" height="180" rx="12" fill="#edf3ee" stroke="#cad8cd"/>
<text x="1707" y="740" font-size="18" fill="#647968" font-weight="600">TARGET 03</text>
<text x="1707" y="780" font-size="21" fill="#19392d" font-weight="400">Run and report the first scientific loop cycle, including</text>
<text x="1707" y="807" font-size="21" fill="#19392d" font-weight="400">a negative result if the criterion fails.</text>
<rect x="65" y="910" width="775" height="180" rx="12" fill="#edf3ee" stroke="#cad8cd"/>
<text x="87" y="945" font-size="18" fill="#647968" font-weight="600">TARGET 04</text>
<text x="87" y="985" font-size="21" fill="#19392d" font-weight="400">Baseline models for the first family; tasks, data scale</text>
<text x="87" y="1012" font-size="21" fill="#19392d" font-weight="400">and acceptance thresholds still require freezing.</text>
<rect x="875" y="910" width="775" height="180" rx="12" fill="#edf3ee" stroke="#cad8cd"/>
<text x="897" y="945" font-size="18" fill="#647968" font-weight="600">TARGET 05</text>
<text x="897" y="985" font-size="21" fill="#19392d" font-weight="400">Release the experiment record formats.</text>
<rect x="1685" y="910" width="775" height="180" rx="12" fill="#edf3ee" stroke="#cad8cd"/>
<text x="1707" y="945" font-size="18" fill="#647968" font-weight="600">TARGET 06</text>
<text x="1707" y="985" font-size="21" fill="#19392d" font-weight="400">Obtain partners and letters for the relevant consortium</text>
<text x="1707" y="1012" font-size="21" fill="#19392d" font-weight="400">routes; no participation or award presumed.</text>
<rect x="65" y="1140" width="2390" height="140" rx="12" fill="#19392d" stroke="#cad8cd"/>
<text x="90" y="1178" font-size="20" fill="#dceade" font-weight="600">BEFORE A SCIENTIFIC CLAIM</text>
<text x="90" y="1220" font-size="25" fill="#ffffff" font-weight="400">Freeze task, data scale, reference and acceptance criterion; retain and publish a failed criterion with its record.</text>
<text x="90" y="1253" font-size="22" fill="#ffffff" font-weight="400">The first loop cycle is independent of a learned model. Baseline preparation is not validated-model acceptance.</text>
<text x="65" y="1343" font-size="23" fill="#647968" font-weight="400">This P case does not fund the full group laboratories, a second model family or the separate chip-design call.</text>
<text x="65" y="1383" font-size="23" fill="#647968" font-weight="400">P first-team schedule shown here. Core-institute delivery and call calendars follow separate scopes and agreements.</text>
<text x="65" y="1450" font-size="21" fill="#647968" font-weight="400">Sources: plan v0.6 section 13; institute budget v0.2; inspected 13 October 2026. All targets remain conditional.</text>
